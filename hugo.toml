baseURL = "https://brice6.pages.dev/"
title = "Brice's Blog"
theme = "PaperMod"

# --------------------
# 基础设置
# --------------------
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# lastmod 取自 git 提交时间（sitemap / OpenGraph / schema 用）
# Cloudflare Pages 构建命令需先 unshallow：git fetch --unshallow || true; hugo --gc
enableGitInfo = true

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[minify]
  minifyOutput = true          # don't depend on the deploy command passing --minify

[pagination]
  pagerSize = 10

# --------------------
# 全局参数
# --------------------
[params]
  env = "production"
  author = "Brice"
  homeTitle = "Brice | AI Research, Mathematics and Systems Notes"
  description = "Notes on AI research, generative video world models, deep learning from first principles, and systems programming in Rust, Zig and C++."
  keywords = ["AI", "Research", "Video Generation", "World Models", "Deep Learning", "Mathematics", "Rust", "Zig", "C++", "Python"]
  images = ["images/avatar-320.webp"]
  defaultTheme = "auto"
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true

  showReadingTime = true
  showWordCount = true
  showCodeCopyButtons = true   # useful for code alongside math
  showBreadCrumbs = true
  showToc = true
  tocOpen = true               # open by default — math posts are long

  mainSections = ["posts"]

  # --------------------
  # 首页：Profile 模式
  # --------------------
  [params.profileMode]
  enabled = true
  title = "Brice"
  subtitle = "AI Research · Video World Models · Systems · Rust · Zig"
  imageUrl = "images/avatar-320.webp"
  imageWidth = 160
  imageHeight = 160
  showPosts = false

  [[params.profileMode.buttons]]
    name = "Blog"
    url = "/posts/"

  [[params.profileMode.buttons]]
    name = "About"
    url = "/about/"

  [params.social]
  twitter = "Bricelucifer"

  [params.schema]
  personName = "Brice"
  personImage = "images/avatar-320.webp"
  sameAs = [
    "https://github.com/BriceLucifer",
    "https://x.com/Bricelucifer",
  ]

# --------------------
# 社交链接
# --------------------
[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/BriceLucifer"

[[params.socialIcons]]
  name = "twitter"
  url  = "https://x.com/Bricelucifer"

[[params.socialIcons]]
  name = "email"
  url  = "mailto:2376671337@qq.com"

[[params.socialIcons]]
  name = "rss"
  url  = "/index.xml"

# --------------------
# 站点图标
# --------------------
[params.assets]
  favicon = "favicon.ico"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"

# --------------------
# Markdown & 高亮
# --------------------
[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.parser]
    autoHeadingID = true

  [markup.goldmark.extensions]
    typographer = false        # keep off — typographer mangles LaTeX quotes

  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["$", "$"],   ["\\(", "\\)"]]

  [markup.highlight]
    noClasses = false
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    style = "dracula"          # higher contrast, easier to read alongside white math

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# --------------------
# 分类系统
# --------------------
[taxonomies]
  tag = "tags"

# --------------------
# 输出（搜索需要 JSON）
# --------------------
[outputs]
  home = ["HTML", "RSS", "JSON"]

# --------------------
# 文章能力：数学公式
# --------------------
# 正文里有 $…$ / $$…$$ 时构建期渲染，并自动加载 KaTeX CSS；也可写 `math: true` 强制开启

# --------------------
# 菜单
# --------------------
[languages]
  [languages.en]
    label = "English"
    weight = 1

    [[languages.en.menu.main]]
      name = "Home"
      url = "/"
      weight = 1

    [[languages.en.menu.main]]
      name = "Blog"
      url = "/posts/"
      weight = 2

    [[languages.en.menu.main]]
      name = "Archive"
      url = "/archives/"
      weight = 3

    [[languages.en.menu.main]]
      name = "Search"
      url = "/search/"
      weight = 4

    [[languages.en.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 5

    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 6
